services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      LLM_FALLBACK_MODE: ${LLM_FALLBACK_MODE:-simulated}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
