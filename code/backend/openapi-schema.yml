openapi: 3.0.0
info:
  title: Smart Tutor API
  version: 1.2.0
servers:
  - url: http://localhost:5000
paths:
  /health:
    get:
      summary: Process liveness (does not initialize or verify models)
      responses:
        '200':
          description: Healthy process; empty body
  /api:
    post:
      summary: Answer a question using the bundled multiprocessor course material
      description: Maximum request body size is 16 KiB. Models load on the first valid request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, category]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Must contain non-whitespace text; trimmed before processing.
                category:
                  type: string
                  enum: [MP]
      responses:
        '200':
          description: Accepted local answer or explicitly labelled simulated external LLM fallback
          content:
            application/json:
              schema:
                type: object
                required: [answer]
                properties:
                  answer:
                    type: string
                  source:
                    type: string
                    enum: [simulated_fallback]
                    description: Present for simulated fallback responses.
                  fallback_reason:
                    type: string
                    description: Present for simulated fallback responses; mixed rejections use no_accepted_answer.
                    enum: [low_retrieval_score, low_qa_score, no_extracted_answer, invalid_retrieval_score, invalid_qa_score, answer_not_in_context, no_accepted_answer]
                  simulated:
                    type: boolean
                    enum: [true]
                    description: Present and true for simulated fallback responses.
        '400':
          description: Malformed JSON or invalid question/category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Model or dataset initialization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
