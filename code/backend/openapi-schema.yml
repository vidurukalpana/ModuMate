openapi: 3.0.0
info:
  title: Smart Tutor API
  description: Every HTTP response includes a generated X-Request-ID header for log correlation.
  version: 1.10.0
servers:
  - url: http://localhost:5000
paths:
  /ready:
    get:
      summary: Snapshot of local model and retrieval initialization
      description: Does not initialize models or check Ollama. Every response includes X-Request-ID.
      responses:
        '200':
          description: Local models and retrieval initialized
          content:
            application/json:
              schema:
                type: object
                required: [ready, local_models_initialized, ollama]
                properties:
                  ready:
                    type: boolean
                  local_models_initialized:
                    type: boolean
                  ollama:
                    type: string
                    enum: [not_checked]
        '503':
          description: Not yet initialized or reset after invalidation
  /metrics:
    get:
      summary: Per-process aggregate request and timing metrics
      security:
        - MetricsAccess: []
      responses:
        '200':
          description: JSON counters and bounded timing summaries; no cached or request contents
          content:
            application/json:
              schema:
                type: object
                required: [scope, sample_limit, counters, timings]
                properties:
                  concurrency:
                    type: object
                    description: Active/admitted/waiting requests, duplicate waiters, shared results, busy counts, and limits.
                    additionalProperties:
                      type: number
                  ollama_concurrency:
                    type: object
                    description: Active/waiting provider calls, busy counts and limit.
                    additionalProperties:
                      type: integer
                  scope:
                    type: string
                    enum: [process]
                  sample_limit:
                    type: integer
                  counters:
                    type: object
                    additionalProperties:
                      type: integer
                  timings:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        count:
                          type: integer
                        mean_seconds:
                          type: number
                        recent_sample_count:
                          type: integer
                        recent_p95_seconds:
                          type: number
        '401':
          description: Missing or incorrect bearer token
        '403':
          description: Metrics access disabled
  /cache/clear:
    post:
      summary: Clear this process's answer cache
      security:
        - CacheAdmin: []
      responses:
        '200':
          description: Cleared; does not expose cached contents
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: integer
                    minimum: 0
        '401':
          description: Missing or incorrect bearer token
        '403':
          description: Administration disabled because CACHE_ADMIN_TOKEN is unset
  /cache/stats:
    get:
      summary: Aggregate cache counters for this process
      description: Does not initialize models or expose cached content. Counters reset at restart. Pre-lookup policy rejections are excluded from misses.
      responses:
        '200':
          description: Snapshot under the cache lock; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [capacity, entries, hits, exact_hits, semantic_hits, misses, hit_rate, inserts, updates, evictions, semantic_enabled, semantic_threshold]
                properties:
                  ttl_seconds:
                    type: number
                  expirations:
                    type: integer
                  invalidations:
                    type: integer
                  invalidated_entries:
                    type: integer
                  invalidation_reasons:
                    type: object
                    additionalProperties:
                      type: integer
                  capacity:
                    type: integer
                    minimum: 1
                  entries:
                    type: integer
                    minimum: 0
                  exact_hits:
                    type: integer
                    minimum: 0
                  semantic_hits:
                    type: integer
                    minimum: 0
                  semantic_enabled:
                    type: boolean
                  semantic_threshold:
                    type: number
                    description: Separate cosine similarity cutoff; not the QA confidence threshold.
                  hits:
                    type: integer
                    minimum: 0
                  misses:
                    type: integer
                    minimum: 0
                  hit_rate:
                    type: number
                    minimum: 0
                    maximum: 1
                  inserts:
                    type: integer
                    minimum: 0
                  updates:
                    type: integer
                    minimum: 0
                  evictions:
                    type: integer
                    minimum: 0
  /health:
    get:
      summary: Process liveness (does not initialize or verify models)
      responses:
        '200':
          description: Healthy process; empty body
  /api:
    post:
      summary: Answer a question using the bundled multiprocessor course material
      description: Maximum request body size is 16 KiB. Models load on the first valid request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, category]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Must contain non-whitespace text; trimmed before processing.
                category:
                  type: string
                  enum: [MP]
      responses:
        '200':
          description: Local answer, simulated fallback, or Ollama answer/abstention
          content:
            application/json:
              schema:
                type: object
                required: [answer, source, sources, cache_hit]
                properties:
                  cache_match_type:
                    type: string
                    enum: [exact, semantic]
                    description: Present only on cache hits.
                  cache_similarity:
                    type: number
                    minimum: -1
                    maximum: 1
                    description: Present only on semantic hits; cosine similarity, not probability of correctness.
                  inflight_shared:
                    type: boolean
                    description: True when sharing an exact duplicate in-flight result; cache_hit is false for this response.
                  cache_hit:
                    type: boolean
                    description: True when this response was served from the shared in-memory cache.
                  answer:
                    type: string
                  source:
                    type: string
                    enum: [local_qa, simulated_fallback, llm_fallback, question_policy]
                    description: Original answer origin; unchanged on cache hits.
                  fallback_reason:
                    type: string
                    description: Present for simulated fallback responses; mixed rejections use no_accepted_answer.
                    enum: [low_retrieval_score, low_qa_score, no_extracted_answer, invalid_retrieval_score, invalid_qa_score, answer_not_in_context, no_accepted_answer]
                  simulated:
                    type: boolean
                    description: True for simulation; false for Ollama responses.
                  reason:
                    type: string
                    enum: [ambiguous_question, missing_course_material, insufficient_course_relevance]
                    description: Deterministic question-policy decision; not an operational error.
                  suggested_topics:
                    type: array
                    items:
                      type: string
                  provider:
                    type: string
                    enum: [ollama]
                  model:
                    type: string
                  abstained:
                    type: boolean
                  sources:
                    description: Supporting supplied excerpts; empty for abstentions, policy decisions, and simulations.
                    type: array
                    items:
                      type: object
                      required: [id, source, topic, chunk_index, excerpt]
                      properties:
                        id:
                          type: string
                        source:
                          type: string
                        topic:
                          type: string
                        chunk_index:
                          type: integer
                          minimum: 0
                          nullable: true
                          description: Zero-based retrieval chunk index within this file; excerpt may include neighboring context.
                        excerpt:
                          type: string
                          description: Actual context supplied to the answer model, after any context-length truncation.
        '400':
          description: Malformed JSON or invalid question/category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Model/dataset initialization failed, Ollama unavailable, or backend capacity exhausted. backend_busy responses include Retry-After 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Invalid Ollama response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Ollama request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    MetricsAccess:
      type: http
      scheme: bearer
    CacheAdmin:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [timeout, provider_unavailable, invalid_response, backend_busy]
