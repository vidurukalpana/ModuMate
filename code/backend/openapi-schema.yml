openapi: 3.0.0
info:
  title: Smart Tutor API
  version: 1.3.0
servers:
  - url: http://localhost:5000
paths:
  /health:
    get:
      summary: Process liveness (does not initialize or verify models)
      responses:
        '200':
          description: Healthy process; empty body
  /api:
    post:
      summary: Answer a question using the bundled multiprocessor course material
      description: Maximum request body size is 16 KiB. Models load on the first valid request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, category]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Must contain non-whitespace text; trimmed before processing.
                category:
                  type: string
                  enum: [MP]
      responses:
        '200':
          description: Local answer, simulated fallback, or Ollama answer/abstention/clarification
          content:
            application/json:
              schema:
                type: object
                required: [answer]
                properties:
                  cache_hit:
                    type: boolean
                    description: True when this response was served from the shared in-memory cache.
                  answer:
                    type: string
                  source:
                    type: string
                    enum: [simulated_fallback, llm_fallback]
                    description: Present for fallback responses.
                  fallback_reason:
                    type: string
                    description: Present for simulated fallback responses; mixed rejections use no_accepted_answer.
                    enum: [low_retrieval_score, low_qa_score, no_extracted_answer, invalid_retrieval_score, invalid_qa_score, answer_not_in_context, no_accepted_answer]
                  simulated:
                    type: boolean
                    description: True for simulation; false for Ollama responses.
                  provider:
                    type: string
                    enum: [ollama]
                  model:
                    type: string
                  abstained:
                    type: boolean
                  needs_clarification:
                    type: boolean
                  clarification:
                    type: string
                  sources:
                    type: array
                    items:
                      type: object
                      required: [id, source, topic]
                      properties:
                        id:
                          type: string
                        source:
                          type: string
                        topic:
                          type: string
        '400':
          description: Malformed JSON or invalid question/category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Model/dataset initialization failed or Ollama unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Invalid Ollama response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Ollama request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [timeout, provider_unavailable, invalid_response]
